name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validation suite (FMEA logic + hydraulics textbook / EPANET cross-check)
        run: node test/run-tests.mjs

      - name: Bundle main-process Excel module
        run: node build/bundle-main.mjs

      - name: Build NSIS installer, portable exe and zip
        run: npx electron-builder --win --x64 --publish never

      - name: Smoke-test the packaged app (all tabs, solvers, PDF + Excel export, project round-trip, EN/SV/AR)
        shell: pwsh
        run: |
          $env:MAMBA_SELFTEST = "$env:RUNNER_TEMP\smoke"
          $p = Start-Process -FilePath "dist\win-unpacked\Mamba FMEA.exe" -PassThru -Wait
          Get-Content "$env:MAMBA_SELFTEST\mamba-selftest.txt"
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          Get-ChildItem $env:MAMBA_SELFTEST

      - name: Install silently and run the installed app's self-test
        shell: pwsh
        run: |
          Get-Process 'Mamba FMEA' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          $setup = Get-ChildItem dist\MambaFMEA-Setup-*.exe | Select-Object -First 1
          $exe = "$env:LOCALAPPDATA\Programs\Mamba FMEA\Mamba FMEA.exe"
          for ($try = 1; $try -le 4 -and !(Test-Path $exe); $try++) {
            $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
            Write-Host "Setup exit code: $($p.ExitCode) (attempt $try)"
            for ($i = 0; $i -lt 60 -and !(Test-Path $exe); $i++) { Start-Sleep 1 }
          }
          if (!(Test-Path $exe)) {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001 } -MaxEvents 6 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message | Out-String -Width 300 | Write-Host
            throw "installed exe not found: $exe"
          }
          Write-Host "Installed: $exe"
          $env:MAMBA_SELFTEST = "$env:RUNNER_TEMP\smoke-installed"
          $q = Start-Process -FilePath $exe -PassThru -Wait
          Get-Content "$env:MAMBA_SELFTEST\mamba-selftest.txt" | Select-Object -First 1
          if ($q.ExitCode -ne 0) { throw "installed app self-test failed ($($q.ExitCode))" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mamba-fmea-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Upload smoke-test screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: ${{ runner.temp }}/smoke

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Mamba FMEA ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/MambaFMEA-Setup-*.exe
            dist/MambaFMEA-Portable-*.exe
            dist/MambaFMEA-*-win-x64.zip
